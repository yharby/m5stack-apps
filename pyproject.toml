[project]
name = "m5stack-apps"
version = "0.1.0"
description = "Personal registry of UIFlow2 MicroPython apps for M5Stack devices"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mpremote>=1.29.0",   # device filesystem + REPL over USB serial
    "esptool>=5.1",       # firmware flash / chip info
    "pyserial>=3.5",      # raw serial for the REPL break-in
    "ruff>=0.14",       # lint
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These run on MicroPython, not CPython: the stdlib is a subset, the modules
# (M5, requests2, audio) only exist on the board, Japanese full-width
# punctuation in string literals is intentional, and MicroPython's zip() has
# no strict= parameter so B905 is unfixable there.
"device/*" = ["UP", "B904", "B905", "SIM105", "RUF001"]
"tools/device_scripts/*" = ["UP", "B904", "B905", "SIM105", "RUF001"]
