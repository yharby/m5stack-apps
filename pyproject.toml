[project]
name = "m5stack-translator"
version = "0.1.0"
description = "Realtime EN<->JA speech translator for M5Stack CoreS3 (UIFlow2 MicroPython)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mpremote>=1.29.0",   # device filesystem + REPL over USB serial
    "esptool>=5.1",       # firmware flash / chip info
    "pyserial>=3.5",      # raw serial for the REPL break-in
    "ruff>=0.14",       # lint
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# device/ runs on MicroPython: its stdlib is a subset and modules
# (M5, requests2, audio) only exist on the board.
"device/*" = ["UP", "B904", "SIM105"]
